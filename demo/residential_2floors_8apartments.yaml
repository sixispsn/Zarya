  hws_type: unknown
  # height_m / пожарно-техническую высоту не получаем умножением 2 × 3.3.
  # Вид ГВС и норма потребления ещё не выбраны; consumers намеренно пуст.
source_data:
  source_description: Учебное условие пользователя, не фактические ТУ
  connection_point: Ось водопроводного ввода на относительной отметке −2,000 м
  guaranteed_head_m: 5.0
  elev_header_m: -2.0
  h_pr_m: 20.0
