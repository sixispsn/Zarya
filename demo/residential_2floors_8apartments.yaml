  frost_depth_m: 1.5
  # Крышка колодца — НЕ лоток и НЕ уровень воды в колодце.
  # Высота подвала — НЕ относительная отметка его чистого пола.
  basement_floor_elevation_m: -3.1
  roof_kind: flat_non_accessible
  roof_relative_elevation_m: 6.6
  external_network_in_scope: false
  design_assignment_ref: >-
    Учебный пример по двум планам и исходным данным пользователя от 15.09.2026.
    Внутренняя открыто проложенная самотечная К1 — Ostendorf HT (PP).
    Для прокладки в грунте и напорных участков серия не назначена.
    Пол подвала -3,100 задан пользователем отдельно от чистой высоты 2,8 м.
    Земля -1,000; глубина промерзания 1,5 м от земли, граница -2,500.
    При использовании 1,5 м как глубины проникания нулевой температуры,
    для К1 диаметром до 500 мм предварительный предел по п. 6.2.4 СП 32.13330.2018:
    лоток не выше -2,200 (-1,000 - 1,500 + 0,300).
    Это ограничение минимального заглубления, не окончательная отметка выпуска:
    проверить минимум 0,7 м до верха трубы, профиль трассы и присоединение к колодцу.
    Отметка водопроводного ввода -2,000 соответствует лишь 1 м от земли;
    защита ввода от промерзания требует отдельной проверки.
    Требуют уточнения: окончательная отметка лотка выпуска, трассировка,
    тип ГВС, нормы расхода и пожарно-техническая высота.
    16.09.2026 подтверждены плоская неэксплуатируемая кровля +6,600 и четыре воронки К2.
    Расстановка К2 предлагается вне квартир, в общедомовых зонах; необходимо согласование с АР.
    Вытяжные части К1: 0,200 м над кровлей по СП 30, 18.18; защитить пластик от УФ по 18.19.
    Диаметры, материал, водосборные площади и отметка выпуска К2 пока не назначены.
  pipes: []
  first_manholes: []
