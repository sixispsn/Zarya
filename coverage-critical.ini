[run]
# A filesystem source directory avoids importing app merely to discover the
# dotted coverage sources (which registers the process-local font twice).
source = app/

[report]
include =
    app/quality_gates.py
    app/architecture/catalog.py
    app/architecture/engineering_handoff.py
    app/architecture/program_report.py
    app/architecture/program_store.py
    app/architecture/residential_program.py
    app/intake/questions.py
    app/intake/preflight.py
